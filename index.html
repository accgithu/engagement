<script>
const $=s=>document.querySelector(s),M=window.Motion,st=$('#st'),U=()=>st.clientWidth/843;
const go=(el,k,o={})=>{const d=o.d||1;if(M&&M.animate)return M.animate(el,k,{duration:d,delay:o.dl||0,ease:o.e||[.3,.7,.2,1],repeat:o.r?Infinity:0,repeatType:o.r?'mirror':'loop'});
const n=Object.values(k)[0].length,kf=[...Array(n)].map((_,i)=>Object.fromEntries(Object.entries(k).map(([p,v])=>[p,v[i]])));
return el.animate(kf,{duration:d*1e3,delay:(o.dl||0)*1e3,fill:'both',easing:'cubic-bezier(.3,.7,.2,1)',iterations:o.r?Infinity:1,direction:o.r?'alternate':'normal'})};
const stop=a=>a&&(a.stop?a.stop():a.cancel());
const seal=$('#seal'),shine=$('#shine'),hint=$('#hint'),flap=$('#flap'),card=$('#card'),cs=$('#cshine'),rp=$('#rp'),scene=$('#scene'),fx=$('#fx');
const bfI=$('#bf'),flTL=$('#fltl'),flBR=$('#flbr'),ribI=$('#rib');
let opened=false,idle,sh,hp,sw=[];
const P=u=>`perspective(${1400*u}px)`;
function ambient(){go(flTL,{transform:['rotate(-.5deg)','rotate(.7deg)']},{d:5.5,r:1,e:'easeInOut'});go(flBR,{transform:['rotate(.6deg)','rotate(-.6deg)']},{d:6.5,r:1,e:'easeInOut'})}

function dust(n,cx,cy,spread,big){const u=U();for(let i=0;i<n;i++){const d=document.createElement('i');d.className='dust';const s=(2+Math.random()*(big?7:4))*u;

const an=go(d,{transform:['translate(0px,0px) scale(1)',`translate(${Math.cos(a)*r}px,${Math.sin(a)*r-40*u}px) scale(.2)`],opacity:[1,0]},{d:1+Math.random()*1.1,dl:Math.random()*.15,e:[.1,.7,.3,1]});
setTimeout(()=>d.remove(),2600)}}
function ring(){const u=U(),r=document.createElement('i');r.className='dust';r.style.cssText=`left:${437*u-60*u}px;top:${1100*u-60*u}px;width:${120*u}px;height:${120*u}px;background:none;border:${3*u}px solid #f3d98a`;fx.appendChild(r);go(r,{transform:['scale(.5)','scale(3.4)'],opacity:[.9,0]},{d:1.2,e:[.1,.7,.3,1]});setTimeout(()=>r.remove(),1400)}

go(ribI,{transform:['rotate(0deg)','rotate(1.6deg)','rotate(-1deg)','rotate(0deg)']},{d:1.4,dl:.5,e:'easeInOut'});
go(scene,{transform:['scale(1) translateY(0px)',`scale(1.025) translateY(${-6*u}px)`,'scale(1) translateY(0px)']},{d:4.5,dl:.4,e:'easeInOut'});
go(flap,{transform:[P(u)+' rotateX(0deg)',P(u)+' rotateX(182deg)']},{d:1.15,dl:1.0,e:[.55,0,.25,1]});
setTimeout(()=>flap.style.zIndex=2,1650);go(flap,{opacity:[1,0]},{d:.3,dl:2.15});go(bfI,{opacity:[0,1]},{d:.6,dl:1.3});
go(card,{transform:[`translateY(${540*u}px) rotate(-1.2deg) scale(.985)`,'translateY(0px) rotate(0deg) scale(1)']},{d:2.3,dl:1.9,e:[.2,.85,.2,1]});
go(cs,{backgroundPosition:['160% 0','-60% 0']},{d:1.5,dl:3.9,e:'easeInOut'});
setTimeout(()=>dust(26,420,170,300,false),3700);setTimeout(()=>rp.classList.add('show'),4600)}
function close(){if(!opened)return;opened=false;const u=U();rp.classList.remove('show');
go(card,{transform:['translateY(0px) rotate(0deg) scale(1)',`translateY(${540*u}px) rotate(-.6deg) scale(.99)`]},{d:1.4,e:[.55,0,.25,1]});
go(flap,{opacity:[0,1]},{d:.1,dl:1.25});go(flap,{transform:[P(u)+' rotateX(182deg)',P(u)+' rotateX(0deg)']},{d:1,dl:1.35,e:[.55,0,.25,1]});
setTimeout(()=>flap.style.zIndex=6,1850);go(bfI,{opacity:[1,0]},{d:.4,dl:2.2});
go(hint,{opacity:[0,1]},{d:.5,dl:2.8});
setTimeout(()=>{seal.style.pointerEvents='';idleOn()},3100)}
